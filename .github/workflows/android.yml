name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Check secure backend configuration
        id: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend credentials are not configured. Compile validation will run, but no APK will be published as a finished build."
          elif [[ "$SUPABASE_URL" != https://* ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_URL must use HTTPS. Compile validation will run, but no APK will be published."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backend.outputs.configured == 'true' && 'entre-noses-apk' || 'entre-noses-apk-local-only' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Report build mode
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.backend.outputs.configured }}" == "true" ]]; then
            echo "APK compilado com configuração de backend fornecida." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "APK compilado em modo local. Login em nuvem e sincronização entre dispositivos não estarão disponíveis até configurar o backend." >> "$GITHUB_STEP_SUMMARY"
          fi
